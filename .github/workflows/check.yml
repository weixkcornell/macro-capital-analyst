name: check-pack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 包自检（平台无关检查；平台校验器在 CI 中不可得，会以 skip note 声明）
        run: node scripts/check-pack.mjs
      - name: 门禁自校准（7 例负向对照，必须全部按预期）
        run: node scripts/selftest-gates.mjs
      - name: digest 可复现性（dry-run：只报是否需要重钉）
        run: node scripts/repin-digests.mjs --dry-run
      - name: i1 解析层自检（8 例含负向样本）
        run: python3 skills/macro-capital-framework/references/scripts/i1_collision_check.py --selftest
      - name: 冒烟测试（照 transport 的 smokeArgs 真跑一次）
        run: node scripts/smoke-test.mjs
